name: Feature proposal
description: Propose a scoped Platform capability or improvement
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or developer problem without assuming a solution.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Proposed ownership
      description: Which package or domain should own this, and why?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: Include compatibility, security, and migration consequences.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
