name: CodeQL (local only)

# Hosted CodeQL is disabled. Security and quality validation use the maintained
# local `bun run check` gate. This workflow is an inert policy sentinel.

on:
  workflow_dispatch:

permissions: {}

jobs:
  local-analysis-only:
    name: Disabled - run the local quality and security gates
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
