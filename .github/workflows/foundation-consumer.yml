name: Foundation Linux consumer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-consumer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consumer:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build the current foundation source once
        run: node scripts/build/buildPackageTopology.mjs --for @velaros-ai/velaros
      - name: Verify real archives and strict Node consumers
        run: bun run check:unified-platform
