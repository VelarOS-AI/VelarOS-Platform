name: Foundation Linux consumer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-consumer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consumer:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.0"
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Build the current foundation source once
        run: node scripts/build/buildPackageTopology.mjs --for @velaros-ai/velaros
      - name: Verify real archives and strict Node consumers
        run: bun run check:unified-platform
