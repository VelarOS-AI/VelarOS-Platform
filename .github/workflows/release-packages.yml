name: "[DISABLED] Release packages (local only)"

# Official Platform packages are published from a clean native checkout with
# `bun run release:local <tag> [--only ...]`. This workflow is intentionally
# inert: keeping the sentinel visible prevents an accidental return to hosted
# release jobs, credentials, or GitHub Actions billing.

on: []

permissions: {}

jobs:
  local-release-only:
    name: Disabled - use bun run release:local
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
