name: Release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match the checked-out package versions)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'VelarOS-AI/VelarOS-Platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - name: Install release tooling from the frozen lockfile
        run: bun install --frozen-lockfile
      - name: Verify, check, pack and publish GitHub release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.PLATFORM_RELEASE_TOKEN || github.token }}
        run: bun run release:github "$RELEASE_TAG"
