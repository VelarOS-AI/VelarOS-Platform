# 单版本火车的发布流水线:标签身份核验 → 全量质量门 → 一次发布全部已声明的包。
#
# 三段顺序不可换:身份最便宜,先失败在它上面;质量门必须在发布之前(发出去不可撤回);
# 发布器自己再复核一遍身份与工作树,不依赖前两步的善意。
#
# 身份契约(kernel / agent 的 check:*-arch 防线会逐条核验本文件与 scripts/release/ 两个脚本的标记):
#   · 只在 tag 上运行;
#   · 发布前必须由 scripts/release/verify-release-ref.mjs 把 tag 绑死到仓根 version;
#   · 发布的必须是同一份已验明的 tarball(由 scripts/release/publish-packages.mjs 的
#     pack→校验→publish 保证:publish 的第一参数是那份 tarball 的路径,不是包目录)。
#
# 发布器与验证器都只有**一份**:并仓前七个源仓各带一套 scripts/<domain>/release/*,并仓后它们
# 枚举的是同一个 packages/、跑的是同一套校验(已功能等价),2026-08 合成 scripts/release/。
# 合并判据、各域独有护栏的去处、以及被丢弃的「包版本 == 仓根 version」锁步断言的理由,
# 见 scripts/release/releaseTopology.mjs 文件头。

name: Release packages

on:
  workflow_dispatch:
    inputs:
      only:
        description: '只发这几个包(逗号分隔,如 agent-lab);留空 = 整列火车全发'
        required: false
        default: ''
      update_consumers:
        description: '发布后为全部已登记消费仓创建依赖升级 PR'
        type: boolean
        required: false
        default: false
  push:
    tags:
      # 整列火车
      - 'v*'
      # 单包发布:<包名或目录名>@<版本>,如 agent-lab@0.1.0
      - '*@*'
      # 带 scope 的全名形态(@velaros-ai/agent-lab@0.1.0)。要单列一条:GitHub 的 tag 过滤里
      # `*` 不跨 `/`,只写 '*@*' 匹配不到带 scope 的 tag,接受它却触发不了就是误导。
      - '*/*@*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      consumer-matrix: ${{ steps.consumer-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 验证器读的是仓根 package.json:tag 必须等于 v<火车版本号>,且发布集合必须与
      # velaros.domainPackages 对齐、各包版本与 bun.lock 一致。
      - run: node scripts/release/verify-release-ref.mjs
      - run: bun run check
      # only 走 env 而不是内联表达式:push 事件下 github.event.inputs 是 null,
      # 内联三元会把 null 当成非空串拼出一个空的 --only 参数,直接红在参数校验上。
      - run: |
          if [ -n "$ONLY" ]; then
            node scripts/release/publish-packages.mjs --only "$ONLY"
          else
            node scripts/release/publish-packages.mjs
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
      # 只有发布器成功退出后才生成消费仓矩阵。这样「包未发出」不可能进入升级阶段。
      - id: consumer-matrix
        run: echo "matrix=$(node scripts/release/consumer-matrix.mjs)" >> "$GITHUB_OUTPUT"

  sync-consumers:
    name: Update ${{ matrix.id }}
    needs: publish
    # 产品代码可能需要同步迁移；跨仓升级由发布者显式选择。
    if: github.ref_type == 'tag' && inputs.update_consumers == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publish.outputs.consumer-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: platform
          persist-credentials: false
      # 跨仓 checkout、推更新分支和建 PR 共用一个最小权限 token。仓库需要配置
      # VELAROS_CONSUMER_UPDATE_TOKEN，权限仅限消费仓 contents:write / pull_requests:write
      # 以及 GitHub Packages read；不使用发布 job 的 GITHUB_TOKEN 越权碰其它仓库。
      - name: Require cross-repository update credential
        run: |
          if [ -z "$CONSUMER_TOKEN" ]; then
            echo "::error::VELAROS_CONSUMER_UPDATE_TOKEN is required for consumer updates"
            exit 1
          fi
        env:
          CONSUMER_TOKEN: ${{ secrets.VELAROS_CONSUMER_UPDATE_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          token: ${{ secrets.VELAROS_CONSUMER_UPDATE_TOKEN }}
          path: consumer
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install Platform release-script dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: platform
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VELAROS_CONSUMER_UPDATE_TOKEN }}
      - name: Align released Platform packages
        run: |
          args=(--consumer "$GITHUB_WORKSPACE/consumer" --release-ref "$GITHUB_REF_NAME")
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          bun platform/scripts/release/sync-platform-consumer.mjs "${args[@]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VELAROS_CONSUMER_UPDATE_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
      - name: Verify frozen cloud install
        if: matrix.lockfile == 'bun'
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VELAROS_CONSUMER_UPDATE_TOKEN }}
      - name: Verify cloud install without creating a lockfile
        if: matrix.lockfile == 'none'
        run: bun install --no-save --ignore-scripts
        working-directory: consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VELAROS_CONSUMER_UPDATE_TOKEN }}
      - name: Verify consumer
        if: matrix.verifyCommand != ''
        run: ${{ matrix.verifyCommand }}
        working-directory: consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VELAROS_CONSUMER_UPDATE_TOKEN }}
      - id: changes
        name: Detect dependency changes
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: consumer
      - name: Push update branch and open pull request
        if: steps.changes.outputs.changed == 'true'
        run: |
          selection="$GITHUB_REF_NAME"
          if [ -n "$ONLY" ]; then
            selection="${selection}--${ONLY}"
          fi
          safe_ref="$(printf '%s' "$selection" | tr -c 'A-Za-z0-9._-' '-')"
          branch="automation/platform-${safe_ref}"
          git config user.name "VelarOS Platform Bot"
          git config user.email "platform-bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore: update Platform packages for ${GITHUB_REF_NAME}"
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$branch:refs/remotes/origin/$branch"
          fi
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          if ! gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --repo "$REPOSITORY" \
              --head "$branch" \
              --title "chore: update Platform packages for ${GITHUB_REF_NAME}" \
              --body "Platform release ${GITHUB_REF_NAME} is published. This PR aligns direct dependencies, refreshes the lockfile from GitHub Packages, rejects local-link resolutions, and has passed the configured consumer verification."
          fi
        working-directory: consumer
        env:
          GH_TOKEN: ${{ secrets.VELAROS_CONSUMER_UPDATE_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
          REPOSITORY: ${{ matrix.repository }}
