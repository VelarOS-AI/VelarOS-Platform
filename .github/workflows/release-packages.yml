# 单版本火车的发布身份门。
#
# 现状(P1):本流水线只做「标签身份核验 + 全量质量门」。真正的发布动作(一次打包并发布 23 个包)
# 属 P2 —— 各域从源仓带来的 scripts/<domain>/release/publish-packages.mjs 仍是逐仓形态,
# 合并成一台火车的发布器要连同版本推进方案一起定,故此处刻意不接 publish 步骤。
#
# 身份契约(kernel / agent 的 check:*-arch 防线会逐条核验本文件与各域 release 脚本的标记):
#   · 只在 tag 上运行;
#   · 发布前必须由 verify-release-ref.mjs 把 tag 绑死到仓根 version;
#   · 发布的必须是同一份已验明的 tarball(由各域 publish-packages.mjs 的 pack→校验→publish 保证)。

name: Release packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 各域验证器读的都是同一份仓根 package.json,tag 必须等于 v<火车版本号>。
      - run: node scripts/kernel/release/verify-release-ref.mjs
      - run: node scripts/agent/release/verify-release-ref.mjs
      - run: node scripts/core/release/verify-release-ref.mjs
      - run: node scripts/model/release/verify-release-ref.mjs
      - run: node scripts/capabilities/release/verify-release-ref.mjs
      - run: node scripts/memory/release/verify-release-ref.mjs
      - run: bun run check
