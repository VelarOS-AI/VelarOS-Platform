name: "[DISABLED] Release Document Renderer (local only)"

# Document Renderer capability packs are built, signed where applicable,
# staged, attested, and finalized on the selected native release host. This
# workflow is intentionally inert and must never own release credentials or
# dispatch hosted builds.

on: []

permissions: {}

jobs:
  local-release-only:
    name: Disabled - use bun run release:document-renderer
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
