name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_diagnostics:
        description: Run focused runtime diagnostics (does not qualify a release)
        type: boolean
        default: false
      gate_diagnostics:
        description: Run architecture and release gate diagnostics (does not qualify a release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.runtime_diagnostics || false }}-${{ inputs.gate_diagnostics || false }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ inputs.runtime_diagnostics && 'Runtime diagnostics' || inputs.gate_diagnostics && 'Gate diagnostics' || 'Full check' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - run: bun install --frozen-lockfile
      - name: Complete quality gate
        if: ${{ !inputs.runtime_diagnostics && !inputs.gate_diagnostics }}
        run: bun run check
      - name: Focused runtime diagnostics
        if: ${{ inputs.runtime_diagnostics }}
        run: |
          bun run build
          cd packages/velaros
          node --test --test-name-pattern 'INV-53 automatic folds|INV-32 长任务|explicit runtime deadlines' act/runtime/test/context-management.test.mjs act/runtime/test/runtime.test.mjs act/runtime/test/node-runtime.test.mjs
      - name: Architecture and release gate diagnostics
        if: ${{ inputs.gate_diagnostics }}
        run: |
          bun run build
          bun run check:gates
