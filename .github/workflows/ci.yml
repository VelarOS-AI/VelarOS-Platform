name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_diagnostics:
        description: Run focused runtime diagnostics (does not qualify a release)
        type: boolean
        default: false
      gate_diagnostics:
        description: Run architecture and release gate diagnostics (does not qualify a release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.runtime_diagnostics || false }}-${{ inputs.gate_diagnostics || false }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ inputs.runtime_diagnostics && 'Runtime diagnostics' || inputs.gate_diagnostics && 'Gate diagnostics' || 'Full check' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
      - run: bun install --frozen-lockfile
      - name: Complete quality gate
        if: ${{ !inputs.runtime_diagnostics && !inputs.gate_diagnostics }}
        run: bun run check
      - name: Focused runtime diagnostics
        if: ${{ inputs.runtime_diagnostics }}
        run: |
          bun run build
          cd packages/velaros
          node --test --test-timeout=60000 --test-reporter=tap act/runtime/test/completion-validation.test.mjs act/runtime/test/execution-observability.test.mjs act/runtime/test/node-runtime.test.mjs act/runtime/test/trace-session-activity.test.mjs act/runtime/test/observation-reuse.test.mjs act/runtime/test/snapshot-observation.test.mjs act/runtime/test/program-catalog.test.mjs act/runtime/test/goals.test.mjs act/runtime/test/host-notes.test.mjs act/runtime/test/request-presentation.test.mjs act/runtime/test/context-index.test.mjs act/runtime/test/execution-presentation.test.mjs act/runtime/test/run-projection.test.mjs act/runtime/test/host-instructions.test.mjs act/runtime/test/event-delivery.test.mjs act/runtime/test/effect-scheduler.test.mjs act/runtime/test/runtime-diagnostics.test.mjs act/runtime/test/trace-index.test.mjs act/system/spec/acceptance.test.mjs act/system/spec/environment.test.mjs act/system/spec/runtime.test.mjs act/system/spec/long-term-memory.test.mjs act/system/spec/store.test.mjs act/search/spec/acceptance.test.mjs act/agents/spec/acceptance.test.mjs act/agents/spec/wait-any.test.mjs act/runtime/test/system-modules.test.mjs act/runtime/test/model-tools.test.mjs act/runtime/test/model-budget.test.mjs act/runtime/test/context-maintenance.test.mjs act/runtime/test/volume-narration.test.mjs act/runtime/test/context-maintenance-retry.test.mjs act/runtime/test/output-context.test.mjs act/runtime/test/output-history-identity.test.mjs act/runtime/test/decision-basis.test.mjs act/runtime/test/completion-recovery.test.mjs act/runtime/test/completion-review.test.mjs act/runtime/test/completion-evidence.test.mjs act/runtime/test/task-loop.test.mjs act/runtime/test/task-lifecycle.test.mjs act/runtime/test/act-run.test.mjs act/runtime/test/act-children.test.mjs act/runtime/test/child-task-materials.test.mjs act/runtime/test/advanced-search.test.mjs act/runtime/test/context-management.test.mjs act/runtime/test/context-memory.test.mjs act/runtime/test/foundation-context.test.mjs act/runtime/test/failed-call-recall.test.mjs act/runtime/test/foundation-lifecycle.test.mjs act/runtime/test/text-decoder.test.mjs act/runtime/test/protocol-parity.test.mjs act/runtime/test/text-runtime.test.mjs act/runtime/test/model-protocol.test.mjs act/runtime/test/script-submission.test.mjs act/runtime/test/incremental-edit.test.mjs act/runtime/test/program-context.test.mjs act/runtime/test/runtime.test.mjs act/runtime/test/dual-core.test.mjs act/runtime/test/platform.test.mjs
      - name: Architecture and release gate diagnostics
        if: ${{ inputs.gate_diagnostics }}
        run: |
          bun run build
          bun run check:gates
