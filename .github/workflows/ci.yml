name: "[DISABLED] CI (local only)"

# Platform validation is run from the maintained local checkout with
# `bun run check`. This workflow is an intentionally inert policy sentinel.

on: []

permissions: {}

jobs:
  local-validation-only:
    name: Disabled - use the maintained local bun run check gate
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
